<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IS Dev Samaj Senior Secondary School</title>
    <script type="text/javascript">
      // GitHub Pages SPA & Project Path Redirect Handler
      (function () {
        var location = window.location;
        var hostname = location.hostname;
        var pathname = location.pathname; // e.g. "/repo-name/some-page"
        var segments = pathname.split('/').filter(Boolean); // ["repo-name", "some-page"]

        // Determine if this is a GitHub Pages project site (username.github.io/repo)
        var isGithubProject = hostname.endsWith('github.io') && segments.length > 0;
        var basePath = isGithubProject ? '/' + segments[0] + '/' : '/';
        var remainingSegments = isGithubProject ? segments.slice(1) : segments;

        // Check if remaining path points to a known in-page section
        var sectionHash = '';
        if (remainingSegments.length > 0) {
          var candidate = remainingSegments[0].toLowerCase();
          var knownSections = [
            'story',
            'admissions',
            'journey',
            'beyond',
            'guldaasta',
            'campus',
            'contact',
            'community',
            'educators',
            'gallery',
            'updates',
            'achievements'
          ];
          if (knownSections.indexOf(candidate) !== -1) {
            sectionHash = '#' + candidate;
          }
        }

        // Preserve existing hash or search query if present
        var finalHash = sectionHash || location.hash || '';
        var finalSearch = location.search || '';

        // Safely redirect to the project base path with the hash/query
        var targetUrl = location.origin + basePath + finalSearch + finalHash;
        location.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 60px; color: #444;">
      Redirecting to homepage...
    </p>
  </body>
</html>
